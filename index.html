<!doctype html>
<html>
<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="image">
    Hover over an image below to display here.
</div>

<img
src="https://tse1.mm.bing.net/th/id/OIP.NUnwf_CNKoTvatXrbyTmrwHaEG?pid=Api"
alt="Beautiful Mountain"
onmouseover="upDate(this)"
onmouseleave="unDo()"
/>

<img
src="https://khoinguonsangtao.vn/wp-content/uploads/2021/12/hinh-nen-may-tinh.jpg"
alt="Blue Ocean"
onmouseover="upDate(this)"
onmouseleave="unDo()"
/>

<script>

function upDate(previewPic){

    document.getElementById("image").innerHTML = previewPic.alt;

    document.getElementById("image").style.backgroundImage =
    "url('" + previewPic.src + "')";
}

function unDo(){

    document.getElementById("image").style.backgroundImage =
    "url('')";

    document.getElementById("image").innerHTML =
    "Hover over an image below to display here.";
}

</script>

</body>
</html>
